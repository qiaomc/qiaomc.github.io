<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digital Bridge 探测</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --card: #fff;
        --text: #18181b;
        --muted: #71717a;
        --ok: #15803d;
        --ok-bg: #dcfce7;
        --err: #b91c1c;
        --err-bg: #fee2e2;
        --line: #e4e4e7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      main {
        max-width: 720px;
        margin: 32px auto;
        padding: 0 16px 48px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 20px;
        font-size: 14px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      button,
      a.btn {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      button.primary {
        background: #18181b;
        color: #fff;
      }
      a.btn {
        background: #fff;
        color: #18181b;
        border: 1px solid var(--line);
      }
      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 600;
      }
      .ok {
        background: var(--ok-bg);
        color: var(--ok);
      }
      .err {
        background: var(--err-bg);
        color: var(--err);
      }
      pre {
        margin: 8px 0 0;
        padding: 12px;
        background: #fafafa;
        border-radius: 8px;
        overflow: auto;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .hint {
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Digital Bridge 探测</h1>
      <p class="sub">
        从当前页面请求本地
        <code>https://localhost:21326</code>
        （需已配置自签名证书并被浏览器信任）。
      </p>

      <div class="row">
        <button class="primary" id="probe" type="button">探测 Bridge</button>
        <a class="btn" href="https://localhost:21326/status/" target="_blank" rel="noreferrer">
          打开 status 页
        </a>
      </div>

      <p class="hint">
        若证书未信任：先打开 status 页，把证书加入系统钥匙串并设为「始终信任」，再回来点探测。
      </p>

      <div class="card">
        <div>
          POST <code>https://localhost:21326/</code>
          <span class="badge" id="root-badge">未测</span>
        </div>
        <pre id="root-out">—</pre>
      </div>

      <div class="card">
        <div>
          POST <code>http://localhost:21326/enumerate</code>
          <span class="badge" id="enum-badge">未测</span>
        </div>
        <pre id="enum-out">—</pre>
      </div>
    </main>

    <script>
      const BRIDGE = "http://localhost:21326";

      function setResult(prefix, ok, text) {
        const badge = document.getElementById(prefix + "-badge");
        const out = document.getElementById(prefix + "-out");
        badge.textContent = ok ? "成功" : "失败";
        badge.className = "badge " + (ok ? "ok" : "err");
        out.textContent = text;
      }

      async function post(path) {
        const res = await fetch(BRIDGE + path, {
          method: "POST",
          credentials: "omit",
          headers: { "Content-Type": "text/plain" },
        });
        const body = await res.text();
        return { status: res.status, body };
      }

      async function probe() {
        try {
          const root = await post("/");
          setResult(
            "root",
            root.status === 200,
            "HTTP " + root.status + "\n" + root.body,
          );
        } catch (e) {
          setResult("root", false, String(e));
        }

        try {
          const enumerated = await post("/enumerate");
          setResult(
            "enum",
            enumerated.status === 200,
            "HTTP " + enumerated.status + "\n" + enumerated.body,
          );
        } catch (e) {
          setResult("enum", false, String(e));
        }
      }

      document.getElementById("probe").addEventListener("click", probe);
      probe();
    </script>
  </body>
</html>
